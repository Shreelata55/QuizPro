<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizPro | MCA Assessment Portal</title>
<style>
:root{--primary:#3157d5;--navy:#12244f;--muted:#68748a;--bg:#f5f7fb;--card:#fff;--line:#e7ebf3;--success:#0c9b69;--danger:#e34b59;--warning:#f3a712;--shadow:0 12px 32px rgba(24,42,78,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#172033}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 17px;background:var(--primary);color:#fff;cursor:pointer;font-weight:700;transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(.97)}button.secondary{background:#edf1fa;color:#263657}button.ghost{background:transparent;color:var(--primary)}button.danger{background:#fff0f2;color:#c52e42}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:22px;color:var(--navy)}.logo{width:44px;height:44px}.nav{display:flex;align-items:center;gap:8px}.user-pill{display:flex;align-items:center;gap:9px;background:#f5f7fc;padding:6px 12px 6px 7px;border-radius:30px;font-weight:800}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eaf0ff;font-size:24px}.wrap{max-width:1240px;margin:auto;padding:28px 20px}.hero{display:grid;grid-template-columns:1.12fr .88fr;gap:28px;align-items:stretch;margin:18px 0 30px}.hero-main{background:linear-gradient(135deg,#edf5ff,#f7f0ff);border:1px solid #e2e8fb;border-radius:28px;padding:38px;position:relative;overflow:hidden}.hero-main:after{content:'🎓';position:absolute;font-size:180px;right:-15px;bottom:-55px;opacity:.12}.eyebrow{display:inline-flex;align-items:center;gap:7px;background:#eaf0ff;color:var(--primary);padding:7px 12px;border-radius:20px;font-size:12px;font-weight:900;letter-spacing:.4px}.hero h1{font-size:48px;line-height:1.08;margin:18px 0 12px;color:var(--navy)}.hero p{font-size:17px;line-height:1.65;color:#5f6b80;max-width:650px}.hero-side{background:linear-gradient(145deg,#3157d5,#694fe5);border-radius:28px;padding:28px;color:#fff;box-shadow:0 22px 50px rgba(49,87,213,.22);position:relative;overflow:hidden}.hero-side h2{font-size:28px;margin:5px 0 8px}.student-pair{font-size:68px;letter-spacing:-12px;margin:5px 0}.mini-white{background:#fff;color:#172033;border-radius:20px;padding:17px;margin-top:18px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini-stat{background:#f7f9ff;border-radius:14px;padding:12px;text-align:center}.mini-stat b{display:block;font-size:20px;color:var(--primary)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:26px 0 13px}.section-head h2{margin:0;color:var(--navy)}.small{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:var(--card);padding:22px;border-radius:20px;box-shadow:var(--shadow);border:1px solid rgba(231,235,243,.8);margin-bottom:18px}.subject-card{position:relative;overflow:hidden;padding:20px}.subject-icon{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:42px;margin-bottom:15px}.subject-card h3{margin:0 0 7px;font-size:20px;color:var(--navy)}.subject-meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.count-badge{background:#f1f4fa;padding:7px 10px;border-radius:20px;font-size:12px;font-weight:800;color:#52607a}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat-card{background:#fff;padding:18px;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}.stat-card .icon{font-size:25px}.stat{font-size:30px;font-weight:900;color:var(--navy);margin-top:6px}.progress{height:9px;background:#edf0f6;border-radius:20px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#3157d5,#7b58e8);border-radius:20px}.form-card{max-width:520px;margin:45px auto}.form-card h2{text-align:center;color:var(--navy);margin:4px 0 7px}.field-error{display:block;color:#c52e42;font-size:12px;font-weight:700;margin:-8px 0 10px}.invalid{border-color:#dc2626!important;background:#fff8f8!important}.valid{border-color:#16a34a!important}.form-error{background:#fff0f2;color:#b42336;border:1px solid #fecdd3;border-radius:11px;padding:10px 12px;margin:8px 0 14px;font-size:13px;font-weight:700}.form-success{background:#ecfdf3;color:#087b56;border:1px solid #bbf7d0;border-radius:11px;padding:10px 12px;margin:8px 0 14px;font-size:13px;font-weight:700}input,select,textarea{width:100%;padding:13px;border:1px solid #d9deea;border-radius:11px;margin:6px 0 14px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#8da2ef;box-shadow:0 0 0 3px #eaf0ff}label{font-size:13px;font-weight:800;color:#4c5870}.actions{display:flex;gap:9px;flex-wrap:wrap}.quiz-layout{display:grid;grid-template-columns:1fr 280px;gap:18px}.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.timer{background:#172033;color:#fff;padding:8px 13px;border-radius:22px;font-weight:900}.question{font-size:22px;line-height:1.45;font-weight:800;color:var(--navy)}.option{padding:15px;border:1px solid #dce1eb;border-radius:13px;margin:11px 0;cursor:pointer;background:#fff;transition:.15s}.option:hover{border-color:#9eafe9;background:#fafbff}.option.selected{border:2px solid var(--primary);background:#eef2ff}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qnum{padding:10px;border-radius:10px;background:#f0f3f8;color:#52607a;font-weight:800}.qnum.done{background:#dff7ed;color:#087b56}.qnum.current{background:var(--primary);color:#fff}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#68748a}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5;white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:#6d7890}.status{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:900;display:inline-block}.pass{background:#e6f8f0;color:#087b56}.fail{background:#fff0f2;color:#c52e42}.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.review-stat{padding:18px;border-radius:18px;background:#f8faff}.review-stat b{display:block;font-size:28px;color:var(--navy)}.answer-row{border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0}.answer-row.correct{border-left:5px solid var(--success)}.answer-row.wrong{border-left:5px solid var(--danger)}.answer-row.skip{border-left:5px solid #aab2c0}.answer-label{font-size:12px;font-weight:900;text-transform:uppercase}.explanation{background:#f6f8ff;padding:12px 14px;border-radius:12px;margin-top:10px;color:#4e5d78;line-height:1.55}.student-card{display:flex;align-items:center;gap:13px}.student-card .avatar{width:54px;height:54px;font-size:32px}.footer{text-align:center;color:#7b8496;padding:30px}.admin-title{display:flex;justify-content:space-between;align-items:center;gap:15px}.chip{padding:6px 9px;border-radius:10px;background:#eef2ff;color:var(--primary);font-size:12px;font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.hero,.quiz-layout{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.review-grid{grid-template-columns:1fr}.hero h1{font-size:38px}}@media(max-width:650px){.top{padding:0 16px}.nav button.secondary{display:none}.wrap{padding:20px 14px}.stat-grid{grid-template-columns:1fr 1fr}.hero-main,.hero-side{padding:25px}.brand span{display:none}.mini-grid{grid-template-columns:1fr 1fr}.quiz-head{align-items:flex-start;flex-direction:column}}

.security-alert{margin:14px 0;padding:12px 16px;border:1px solid #f59e0b;background:#fff7e6;color:#92400e;border-radius:12px;font-size:14px}.security-toast{position:fixed;right:24px;top:88px;z-index:9999;max-width:380px;background:#fff7e6;color:#7c2d12;border:2px solid #f59e0b;border-radius:16px;padding:15px 18px;box-shadow:0 18px 45px rgba(0,0,0,.16);line-height:1.45;font-size:14px;animation:securityIn .25s ease}@keyframes securityIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
.password-field{position:relative;margin:0 0 0}.password-field input{padding-right:48px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:0;border-radius:9px;background:transparent;color:#68748a;display:grid;place-items:center;font-size:18px;line-height:1;box-shadow:none}.password-toggle:hover{background:#f1f4fa;color:var(--navy);transform:translateY(-50%);filter:none}.password-toggle:focus-visible{outline:3px solid #eaf0ff;outline-offset:1px}
.status.review{background:#fff7e6;color:#92400e}
.time-alert{border-color:#f59e0b!important;background:#fff7ed!important;color:#9a3412!important}.time-toast{border-color:#f59e0b!important;background:#fff7ed!important;color:#9a3412!important}.danger-timer{color:#dc2626!important;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}

.pie-card{margin:20px 0}.pie-wrap{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:center}.pie-chart{width:230px;height:230px;border-radius:50%;margin:auto;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.pie-hole{width:116px;height:116px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 4px 18px rgba(24,42,78,.08)}.pie-hole b{display:block;font-size:26px;color:var(--navy);line-height:1}.pie-hole span{font-size:12px;color:var(--muted);font-weight:700}.pie-legend{display:grid;gap:14px}.pie-legend-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fbfcff}.pie-label{display:flex;align-items:center;gap:10px;font-weight:800;color:#263657}.pie-dot{width:13px;height:13px;border-radius:50%;display:inline-block;flex:none}.pie-value{font-weight:900;color:var(--navy)}@media(max-width:650px){.pie-wrap{grid-template-columns:1fr}.pie-chart{width:200px;height:200px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><svg class="logo" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#3157d5"/><path d="M9 21l15-9 15 9-15 9-15-9Z" fill="white"/><path d="M15 25v8c5 4 13 4 18 0v-8M39 22v11" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/></svg><span>QuizPro</span></div><div class="nav" id="nav"></div></header>
<main id="app"></main><div class="footer">QuizPro • MCA Online Assessment & Learning Portal • Built for MCA Students 🎓</div>
<script>
const API='http://localhost:3000/api';let user=JSON.parse(localStorage.getItem('quizUser')||'null');let state={questions:[],answers:{},index:0,subject:null,timer:null,time:600,submitted:false,suspiciousCount:0,suspiciousEvents:[],quizMonitoring:false,warningShown:{60:false,30:false,10:false}};
const icons={'java':'☕','dbms':'🗄️','cyber security':'🛡️','data mining':'⛏️','software engineering':'⚙️','computer networks':'🌐','operating systems':'💻','cloud computing':'☁️','python':'🐍','artificial intelligence':'🤖'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function avatar(g){return g==='MALE'?'👨‍🎓':g==='FEMALE'?'👩‍🎓':'🧑‍🎓'}function icon(s){return s?.icon||icons[String(s?.name||'').toLowerCase()]||'📚'}

const VALIDATION_RULES={
  email:{pattern:/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/,message:'Enter a valid email address.'},
  name:{pattern:/^[A-Za-z][A-Za-z .'-]{1,99}$/,message:'Name must be 2–100 characters and contain letters, spaces, apostrophes or hyphens.'},
  password:{pattern:/^(?=.*[A-Za-z])(?=.*\d).{8,72}$/,message:'Password must be 8–72 characters and include at least one letter and one number.'}
};
function passwordContainer(el){return el?.closest('.password-field')||el}
function showFieldError(el,msg){
  if(!el)return;
  el.classList.add('invalid');el.classList.remove('valid');
  const anchor=passwordContainer(el);let e=anchor.nextElementSibling;
  if(!e||!e.classList.contains('field-error')){e=document.createElement('small');e.className='field-error';anchor.insertAdjacentElement('afterend',e)}
  e.textContent=msg;
}
function clearFieldError(el){
  if(!el)return;el.classList.remove('invalid');el.classList.add('valid');
  const anchor=passwordContainer(el);const e=anchor.nextElementSibling;if(e?.classList.contains('field-error'))e.remove();
}
function enhancePasswordFields(){
  document.querySelectorAll('input[type="password"]:not([data-eye-ready]),input[data-eye-ready="true"]').forEach(input=>{
    if(input.dataset.eyeReady==='true')return;
    const wrapper=document.createElement('div');wrapper.className='password-field';
    input.parentNode.insertBefore(wrapper,input);wrapper.appendChild(input);
    input.dataset.eyeReady='true';
    const toggle=document.createElement('button');toggle.type='button';toggle.className='password-toggle';toggle.setAttribute('aria-label','Show password');toggle.setAttribute('aria-pressed','false');toggle.innerHTML='👁️';
    toggle.addEventListener('click',()=>{
      const visible=input.type==='text';input.type=visible?'password':'text';
      toggle.innerHTML=visible?'👁️':'🙈';toggle.setAttribute('aria-label',visible?'Show password':'Hide password');toggle.setAttribute('aria-pressed',String(!visible));
    });
    wrapper.appendChild(toggle);
  });
}
const passwordObserver=new MutationObserver(enhancePasswordFields);
passwordObserver.observe(document.getElementById('app'),{childList:true,subtree:true});

function validateField(el){
  if(!el)return true;
  const v=el.value.trim();
  if(el.required&&!v){showFieldError(el,'This field is required.');return false}
  if(!v){clearFieldError(el);return true}
  const id=el.id;
  if(['email','regEmail','fpEmail','stEmail'].includes(id)&&!VALIDATION_RULES.email.pattern.test(v)){showFieldError(el,VALIDATION_RULES.email.message);return false}
  if(['regName','stName'].includes(id)&&!VALIDATION_RULES.name.pattern.test(v)){showFieldError(el,VALIDATION_RULES.name.message);return false}
  if(['regPassword','fpPassword','stPassword'].includes(id)&&!VALIDATION_RULES.password.pattern.test(v)){showFieldError(el,VALIDATION_RULES.password.message);return false}
  if(el.minLength>0&&v.length<el.minLength){showFieldError(el,`Minimum ${el.minLength} characters required.`);return false}
  if(el.maxLength>0&&v.length>el.maxLength){showFieldError(el,`Maximum ${el.maxLength} characters allowed.`);return false}
  if(el.type==='number'){
    const n=Number(v);
    if(!Number.isInteger(n)||n<Number(el.min)||n>Number(el.max)){showFieldError(el,`Enter a whole number from ${el.min} to ${el.max}.`);return false}
  }
  if(id==='sicon'&&[...v].length>4){showFieldError(el,'Use a maximum of 4 characters for the emoji/icon.');return false}
  clearFieldError(el);return true;
}
function validateForm(form){
  if(!form)return false;
  let ok=true;
  form.querySelectorAll('input,select,textarea').forEach(el=>{if(!validateField(el))ok=false});
  if(!ok){const first=form.querySelector('.invalid');first?.focus()}
  return ok;
}
document.addEventListener('blur',e=>{if(e.target.matches('form input,form select,form textarea'))validateField(e.target)},true);
document.addEventListener('input',e=>{if(e.target.matches('form input,form select,form textarea')&&e.target.classList.contains('invalid'))validateField(e.target)});
document.addEventListener('change',e=>{if(e.target.matches('form input,form select,form textarea'))validateField(e.target)});

function formError(form,message){
  let e=form.querySelector('.form-error');
  if(!e){e=document.createElement('div');e.className='form-error';form.prepend(e)}
  e.textContent=message;
}

async function api(url,opt={}){try{const r=await fetch(API+url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw new Error(d.error||`Server error ${r.status}`);return d}catch(e){if(e instanceof TypeError)throw new Error('Cannot connect to the quiz server. Make sure npm start is running in VS Code.');throw e}}
function nav(){document.getElementById('nav').innerHTML=user?`<div class="user-pill"><span class="avatar">${avatar(user.gender)}</span><span>${esc(user.name)}</span></div><button class="secondary" onclick="home()">Dashboard</button><button onclick="logout()">Logout</button>`:`<button class="secondary" onclick="loginPage()">Login</button><button onclick="registerPage()">Register</button>`}
function logout(){user=null;localStorage.removeItem('quizUser');clearInterval(state.timer);home()}
function home(){nav();if(user?.role==='ADMIN')return admin();if(user)return student();document.getElementById('app').innerHTML=`<div class="wrap"><section class="hero"><div class="hero-main"><span class="eyebrow">🎓 MCA • SMART ASSESSMENT</span><h1>Learn. Practice.<br><span style="color:var(--primary)">Perform Better.</span></h1><p>QuizPro is a professional online assessment portal for MCA students. Practice core subjects, take timed quizzes, review every answer and track your improvement.</p><div class="actions"><button onclick="registerPage()">🚀 Get Started</button><button class="secondary" onclick="loginPage()">Sign In →</button></div><div class="actions" style="margin-top:22px"><span class="chip">⏱ Timed Tests</span><span class="chip">📊 Performance Analytics</span><span class="chip">💡 Answer Explanations</span></div></div><div class="hero-side"><div class="student-pair">👨‍🎓 👩‍🎓</div><h2>Small Steps, Big Dreams ✨</h2><p style="color:#eaf0ff">Build confidence one question at a time with MCA-focused assessments.</p><div class="mini-white"><b>Why QuizPro?</b><div class="mini-grid" style="margin-top:12px"><div class="mini-stat"><b>10</b><span class="small">Questions</span></div><div class="mini-stat"><b>10</b><span class="small">Minutes</span></div><div class="mini-stat"><b>100%</b><span class="small">Review</span></div></div></div></div></section><div class="section-head"><div><h2>Everything you need to practice</h2><span class="small">Designed for MCA-level learning and assessment.</span></div></div><section class="grid"><div class="card"><h3>⏱ Timed Quizzes</h3><p class="small">Challenge yourself with a focused 10-minute assessment.</p></div><div class="card"><h3>🎯 Detailed Results</h3><p class="small">See correct, wrong and not-attempted questions instantly.</p></div><div class="card"><h3>💡 Learn from Mistakes</h3><p class="small">Review the correct answer with a clear explanation.</p></div><div class="card"><h3>🏆 Leaderboard</h3><p class="small">Compare your best scores and stay motivated.</p></div></section></div>`}
function loginPage(){document.getElementById('app').innerHTML=`<div class="wrap"><div class="card form-card"><div style="text-align:center;font-size:48px">🔐</div><h2>Welcome Back</h2><p class="small" style="text-align:center">Login to your MCA assessment dashboard.</p><form id="loginForm" novalidate onsubmit="login(event)"><label>Email</label><input id="email" type="email" maxlength="150" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" minlength="4" maxlength="72" autocomplete="current-password" required placeholder="Password"><button style="width:100%">Login →</button></form><p class="small"><a href="#" onclick="forgotPage();return false">Forgot Password?</a> · <a href="#" onclick="registerPage();return false">Create account</a></p></div></div>`}
function registerPage(){document.getElementById('app').innerHTML=`<div class="wrap"><div class="card form-card"><div style="text-align:center;font-size:50px">🎓</div><h2>Create Student Account</h2><p class="small" style="text-align:center">Choose your student avatar and start learning.</p><form id="registerForm" novalidate onsubmit="register(event)"><label>Full Name</label><input id="regName" minlength="2" maxlength="100" autocomplete="name" required placeholder="Enter your name"><label>Email</label><input id="regEmail" type="email" maxlength="150" autocomplete="email" required placeholder="student@example.com"><label>Password</label><input id="regPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Minimum 4 characters"><label>Student Avatar</label><select id="regGender"><option value="FEMALE">👩‍🎓 Girl Student</option><option value="MALE">👨‍🎓 Boy Student</option><option value="OTHER">🧑‍🎓 Other Student</option></select><button style="width:100%">Create Account 🚀</button></form><p class="small">Already registered? <a href="#" onclick="loginPage();return false">Login</a></p></div></div>`}
function forgotPage(){document.getElementById('app').innerHTML=`<div class="wrap"><div class="card form-card"><div style="text-align:center;font-size:45px">🔑</div><h2>Reset Password</h2><form id="forgotForm" novalidate onsubmit="forgotPassword(event)"><label>Registered Email</label><input id="fpEmail" type="email" maxlength="150" autocomplete="email" required><label>New Password</label><input id="fpPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><button style="width:100%">Reset Password</button></form><p class="small"><a href="#" onclick="loginPage();return false">← Back to Login</a></p></div></div>`}
async function forgotPassword(e){e.preventDefault();if(!validateForm(document.getElementById('forgotForm')))return;try{await api('/forgot-password',{method:'POST',body:JSON.stringify({email:fpEmail.value.trim(),newPassword:fpPassword.value})});alert('Password reset successful.');loginPage()}catch(x){alert(x.message)}}
async function register(e){e.preventDefault();if(!validateForm(document.getElementById('registerForm')))return;try{await api('/register',{method:'POST',body:JSON.stringify({name:regName.value.trim(),email:regEmail.value.trim(),password:regPassword.value,gender:regGender.value})});alert('Registration successful! You can now login.');loginPage()}catch(x){alert(x.message)}}
async function login(e){e.preventDefault();if(!validateForm(document.getElementById('loginForm')))return;try{const d=await api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});user=d.user;localStorage.setItem('quizUser',JSON.stringify(user));home()}catch(x){alert(x.message)}}
async function student(){nav();try{const [s,r,l]=await Promise.all([api('/subjects'),api('/results/user/'+user.id),api('/leaderboard')]);const attempts=r.length,avg=attempts?r.reduce((a,x)=>a+Number(x.percentage),0)/attempts:0,best=attempts?Math.max(...r.map(x=>Number(x.percentage))):0,correct=attempts?r.reduce((a,x)=>a+Number(x.score),0):0,total=attempts?r.reduce((a,x)=>a+Number(x.total_questions),0):0;const rank=l.findIndex(x=>x.id===user.id)+1;document.getElementById('app').innerHTML=`<div class="wrap"><section class="hero" style="margin-top:0"><div class="hero-main"><span class="eyebrow">👋 WELCOME BACK</span><h1>Hello, ${esc(user.name)}! ${avatar(user.gender)}</h1><p>Keep learning, keep growing. Choose a subject below and test your MCA knowledge.</p><div class="actions"><button onclick="document.getElementById('subjects').scrollIntoView({behavior:'smooth'})">📚 Explore Subjects</button><button class="secondary" onclick="myResults()">📊 View Attempts</button></div></div><div class="hero-side"><div class="student-card"><span class="avatar" style="width:70px;height:70px;font-size:45px">${avatar(user.gender)}</span><div><div style="font-size:13px;color:#dce5ff">MCA STUDENT</div><h2 style="margin:2px 0">${esc(user.name)}</h2></div></div><p style="color:#eaf0ff">“Knowledge is the key to unlock your future.” 🔑</p><div class="mini-grid"><div class="mini-stat"><b>${attempts}</b><span>Attempts</span></div><div class="mini-stat"><b>${best.toFixed(0)}%</b><span>Best Score</span></div><div class="mini-stat"><b>${rank||'—'}</b><span>Rank</span></div></div></div></section><div class="stat-grid"><div class="stat-card"><div class="icon">📝</div><div class="stat">${attempts}</div><div class="small">Total Attempts</div></div><div class="stat-card"><div class="icon">🎯</div><div class="stat">${avg.toFixed(0)}%</div><div class="small">Average Score</div></div><div class="stat-card"><div class="icon">✅</div><div class="stat">${correct}</div><div class="small">Correct Answers</div></div><div class="stat-card"><div class="icon">📈</div><div class="stat">${total?Math.round(correct/total*100):0}%</div><div class="small">Accuracy</div></div></div><div id="subjects" class="section-head"><div><h2>📚 MCA Subjects</h2><span class="small">Select a subject and start your assessment.</span></div><span class="chip">${s.length} Subjects</span></div><div class="grid">${s.map(x=>`<div class="card subject-card" style="background:linear-gradient(145deg,${x.color||'#f5f7ff'},#fff)"><div class="subject-icon" style="background:#ffffffaa">${icon(x)}</div><h3>${esc(x.name)}</h3><p class="small">${esc(x.description||'Practice important MCA concepts and improve your score.')}</p><div class="subject-meta"><span class="count-badge">📖 ${x.question_count||'Quiz'} Questions</span><button onclick="startQuiz(${x.id})">Start Quiz →</button></div></div>`).join('')}</div><div class="section-head"><div><h2>🕘 Recent Attempts</h2><span class="small">Your latest assessment activity.</span></div><button class="secondary" onclick="myResults()">View All</button></div><div class="card">${attempts?table(r.slice(0,5),['subject_name','score','total_questions','percentage','quiz_date'],'recent'): '<div class="empty">No attempts yet. Start your first quiz above 🚀</div>'}</div></div>`}catch(x){document.getElementById('app').innerHTML=`<div class="wrap"><div class="card">${esc(x.message)}</div></div>`}}
let quizListenersBound=false;
function suspiciousLabel(type){
  return ({'TAB_SWITCH':'Tab/window switch','WINDOW_BLUR':'Quiz window lost focus','COPY':'Copy attempt','PASTE':'Paste attempt','CUT':'Cut attempt','CONTEXT_MENU':'Right-click/context menu'}[type]||type);
}
function showSuspiciousWarning(type,details){
  const el=document.getElementById('securityAlert');
  const qNo=state.index+1, total=state.questions.length;
  if(el){
    el.innerHTML=`⚠️ <b>Warning — suspicious activity detected!</b><br><span>You are on Question ${qNo} of ${total}. ${esc(suspiciousLabel(type))} detected.</span><br><span class="small">Event ${state.suspiciousCount}: ${esc(details||'Please stay on the quiz page.')}</span>`;
    el.style.display='block';
  }
  const toast=document.createElement('div');
  toast.className='security-toast';
  toast.innerHTML=`⚠️ <b>Warning!</b> Suspicious activity detected on <b>Question ${qNo}</b>.<br><span>${esc(suspiciousLabel(type))}</span>`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),4500);
}
async function logSuspicious(type,details){
  if(!state.quizMonitoring||state.submitted)return;
  state.suspiciousCount++;
  const q=state.questions[state.index];
  const fullDetails=`Question ${state.index+1}${q?.question?' — '+String(q.question).slice(0,100):''}: ${details||''}`;
  state.suspiciousEvents.push({type,question_number:state.index+1,time:new Date().toLocaleTimeString(),details:fullDetails});
  showSuspiciousWarning(type,fullDetails);
  try{await api('/quiz/suspicious-activity',{method:'POST',body:JSON.stringify({user_id:user.id,subject_id:state.subject?.id,activity_type:type,details:fullDetails})});}catch(e){}
  if(state.suspiciousCount>=3){
    const ok=confirm('⚠️ Multiple suspicious activities were detected during this assessment. The event log will be included in your attempt record. Continue the quiz?');
    if(!ok) submitQuiz(false);
  }
}
function bindQuizMonitoring(){
  state.quizMonitoring=true;
  if(quizListenersBound)return;
  quizListenersBound=true;
  document.addEventListener('visibilitychange',()=>{if(document.hidden)logSuspicious('TAB_SWITCH','Quiz tab became hidden');});
  window.addEventListener('blur',()=>{if(state.quizMonitoring&&!document.hidden)logSuspicious('WINDOW_BLUR','Quiz window lost focus');});
  document.addEventListener('copy',e=>{if(state.quizMonitoring){e.preventDefault();logSuspicious('COPY','Copy action blocked');}});
  document.addEventListener('cut',e=>{if(state.quizMonitoring){e.preventDefault();logSuspicious('CUT','Cut action blocked');}});
  document.addEventListener('paste',e=>{if(state.quizMonitoring){e.preventDefault();logSuspicious('PASTE','Paste action blocked');}});
  document.addEventListener('contextmenu',e=>{if(state.quizMonitoring){e.preventDefault();logSuspicious('CONTEXT_MENU','Right-click blocked during quiz');}});
  window.addEventListener('pagehide',()=>{if(state.quizMonitoring&&!state.submitted)logSuspicious('PAGE_HIDE','Quiz page was hidden or navigated away');});
  window.addEventListener('pageshow',()=>{if(state.quizMonitoring&&!state.submitted){const el=document.getElementById('securityAlert');if(el)el.style.display='block';}});
  document.addEventListener('keydown',e=>{if(!state.quizMonitoring)return;const k=String(e.key).toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','v','x'].includes(k)){e.preventDefault();logSuspicious(k==='c'?'COPY':k==='v'?'PASTE':'CUT','Keyboard shortcut blocked');}if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();logSuspicious('DEVTOOLS','Developer tools shortcut blocked');}});
}
function unbindQuizMonitoring(){state.quizMonitoring=false;}
async function startQuiz(id){try{state.subject=(await api('/subjects')).find(x=>x.id==id);const quizData=await api('/quiz/'+id);state.questions=Array.isArray(quizData)?quizData:quizData.questions;if(!state.questions.length)return alert('No questions available for this subject. Ask the administrator to add questions.');const duration=Number((Array.isArray(quizData)?state.subject.test_duration:quizData.test_duration)||state.subject.test_duration||10);state.answers={};state.index=0;state.time=Math.max(60,duration*60);state.warningShown={60:false,30:false,10:false};state.submitted=false;state.suspiciousCount=0;state.suspiciousEvents=[];clearInterval(state.timer);bindQuizMonitoring();renderQuestion();state.timer=setInterval(()=>{if(state.submitted)return;state.time--;if([60,30,10].includes(state.time)&&!state.warningShown[state.time]){state.warningShown[state.time]=true;showTimeWarning(state.time);}renderQuestion();if(state.time<=0){clearInterval(state.timer);showTimeWarning(0);setTimeout(()=>submitQuiz(true),1200)}},1000)}catch(x){alert(x.message)}}
function showTimeWarning(seconds){const el=document.getElementById('securityAlert');if(seconds>0){const msg=seconds>=60?`${Math.floor(seconds/60)} minute${Math.floor(seconds/60)!==1?'s':''} remaining`:seconds===30?'30 seconds remaining':'10 seconds remaining';if(el){el.innerHTML=`⏰ <b>Time Warning</b><br><span>${msg}. Please complete this question and submit the test before the timer reaches zero.</span>`;el.style.display='block';el.className='security-alert time-alert';}const toast=document.createElement('div');toast.className='security-toast time-toast';toast.innerHTML=`⏰ <b>Time Warning!</b> ${msg}.`;document.body.appendChild(toast);setTimeout(()=>toast.remove(),4500);}else{if(el){el.innerHTML=`⏰ <b>Time Over!</b><br><span>Your test is being submitted automatically.</span>`;el.style.display='block';el.className='security-alert time-alert';}}}
function renderQuestion(){const q=state.questions[state.index];if(!q)return;const m=String(Math.floor(state.time/60)).padStart(2,'0'),s=String(state.time%60).padStart(2,'0');document.getElementById('app').innerHTML=`<div class="wrap"><div class="quiz-layout"><div class="card"><div class="quiz-head"><div><span class="eyebrow">${icon(state.subject)} ${esc(state.subject.name)}</span><h2 style="margin:12px 0 0">Question ${state.index+1} of ${state.questions.length}</h2></div><span class="timer ${state.time<=30?'danger-timer':''}">⏱ ${m}:${s}</span></div><div id="securityAlert" class="security-alert" style="display:${state.suspiciousCount>0?'block':'none'}">${state.suspiciousCount>0?`⚠️ <b>Warning — suspicious activity detected!</b><br><span>You are on Question ${state.index+1} of ${state.questions.length}. ${state.suspiciousCount} event${state.suspiciousCount===1?'':'s'} recorded. Please stay on the quiz page.</span>`:''}</div><div class="progress" style="margin:18px 0"><span style="width:${((state.index+1)/state.questions.length)*100}%"></span></div><p class="question">${esc(q.question)}</p>${['A','B','C','D'].map(k=>`<div class="option ${state.answers[q.id]===k?'selected':''}" onclick="answer('${k}')"><b>${k}.</b> ${esc(q['option_'+k.toLowerCase()])}</div>`).join('')}<div class="actions" style="margin-top:22px"><button class="secondary" onclick="prev()" ${state.index===0?'disabled':''}>← Previous</button>${state.index<state.questions.length-1?'<button onclick="next()">Next →</button>':'<button onclick="submitQuiz()">Submit Quiz ✓</button>'}</div></div><aside><div class="card"><h3 style="margin-top:0">🧭 Question Palette</h3><div class="palette">${state.questions.map((x,i)=>`<button class="qnum ${i===state.index?'current':''} ${state.answers[x.id]?'done':''}" onclick="goQ(${i})">${i+1}</button>`).join('')}</div><div class="legend" style="margin-top:16px"><span><i class="dot" style="background:#3157d5"></i>Current</span><span><i class="dot" style="background:#0c9b69"></i>Answered</span><span><i class="dot" style="background:#cbd1dc"></i>Pending</span></div></div><div class="card"><h3>🛡️ Exam Security</h3><p class="small">Tab switching, leaving the quiz window, copy/paste and right-click are monitored and recorded.</p><div class="chip">🔎 Events: ${state.suspiciousCount}</div></div><div class="card"><h3>💡 Tip</h3><p class="small">You can move between questions. Unanswered questions will be counted as <b>Not Attempted</b>.</p></div></aside></div></div>`}
function answer(k){state.answers[state.questions[state.index].id]=k;renderQuestion()}function next(){if(state.index<state.questions.length-1){state.index++;renderQuestion()}}function prev(){if(state.index>0){state.index--;renderQuestion()}}function goQ(i){state.index=i;renderQuestion()}
async function submitQuiz(auto=false){if(state.submitted)return;state.submitted=true;clearInterval(state.timer);unbindQuizMonitoring();const answers=state.questions.map(q=>({question_id:q.id,selected_answer:state.answers[q.id]||null}));try{const r=await api('/quiz/submit',{method:'POST',body:JSON.stringify({user_id:user.id,subject_id:state.subject.id,answers,suspicious_activity_count:state.suspiciousCount})});const correct=r.score,wrong=answers.filter((a,i)=>a.selected_answer&&a.selected_answer!==r.answers?.[i]?.correct_answer).length;document.getElementById('app').innerHTML=`<div class="wrap"><div class="card" style="max-width:820px;margin:35px auto;text-align:center"><div style="font-size:72px">${r.status==='PASS'?'🎉':'📚'}</div><span class="status ${r.status==='PASS'?'pass':'fail'}">${r.status}</span><h1>${esc(state.subject.name)} Assessment Complete</h1><p class="small">${auto?'⏰ Time ended automatically.':'Great work! Your attempt has been recorded.'}</p><div class="review-grid" style="margin:25px 0;text-align:left"><div class="review-stat"><span>🎯 Score</span><b>${r.score}/${r.total_questions}</b></div><div class="review-stat"><span>📈 Percentage</span><b>${Number(r.percentage).toFixed(0)}%</b></div><div class="review-stat"><span>📝 Attempt</span><b>#${r.attempt_id}</b></div><div class="review-stat"><span>🛡️ Security Events</span><b>${state.suspiciousCount}</b></div></div><div class="actions" style="justify-content:center"><button onclick="reviewAttempt(${r.attempt_id})">🔍 Review Answers</button><button class="secondary" onclick="home()">Back to Dashboard</button></div></div></div>`}catch(x){state.submitted=false;alert(x.message)}}
function table(rows,cols){if(!rows.length)return '<div class="empty">No records found.</div>';const labels={subject_name:'Subject',score:'Score',total_questions:'Total',percentage:'Percentage',quiz_date:'Date',name:'Student',email:'Email',role:'Role',gender:'Avatar',id:'ID',attempts:'Attempts',best_percentage:'Best %'};return `<div class="table-wrap"><table><tr>${cols.map(c=>`<th>${labels[c]||c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c==='percentage'||c==='best_percentage'?Number(r[c]).toFixed(0)+'%':c==='gender'?avatar(r[c]):esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</table></div>`}
async function myResults(){try{const r=await api('/results/user/'+user.id);document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-head"><div><h1 style="margin:0">📊 My Attempts</h1><span class="small">Every quiz attempt is stored in MySQL.</span></div><button class="secondary" onclick="home()">← Dashboard</button></div><div class="card">${r.length?`<div class="table-wrap"><table><tr><th>Subject</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Not Attempted</th><th>Percentage</th><th>Status</th><th>Review</th></tr>${r.map(x=>{const not=Number(x.not_attempted||0),wrong=Number(x.wrong_count||0);return `<tr><td>${icon({name:x.subject_name,icon:x.subject_icon})} ${esc(x.subject_name)}</td><td><b>${x.score}/${x.total_questions}</b></td><td style="color:var(--success)">✅ ${x.score}</td><td style="color:var(--danger)">❌ ${wrong}</td><td>⭕ ${not}</td><td><b>${Number(x.percentage).toFixed(0)}%</b></td><td><span class="status ${Number(x.percentage)>=40?'pass':'fail'}">${Number(x.percentage)>=40?'PASS':'FAIL'}</span></td><td><button class="secondary" onclick="reviewAttempt(${x.id})">Review</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">No quiz attempts yet.</div>'}</div></div>`}catch(x){alert(x.message)}}
async function reviewAttempt(id){try{const d=await api('/results/attempt/'+id),a=d.answers,correct=a.filter(x=>x.is_correct).length,skipped=a.filter(x=>!x.selected_answer).length,wrong=a.length-correct-skipped;document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-head"><div><h1 style="margin:0">🔍 Attempt #${id} Review</h1><span class="small">${icon({name:d.attempt.subject_name,icon:d.attempt.subject_icon})} ${esc(d.attempt.subject_name)} • ${new Date(d.attempt.quiz_date).toLocaleString()}</span></div><button class="secondary" onclick="myResults()">← My Attempts</button></div><div class="card"><div class="review-grid"><div class="review-stat"><span>✅ Correct</span><b style="color:var(--success)">${correct}</b></div><div class="review-stat"><span>❌ Wrong</span><b style="color:var(--danger)">${wrong}</b></div><div class="review-stat"><span>⭕ Not Attempted</span><b>${skipped}</b></div></div><div style="margin-top:18px"><div class="progress"><span style="width:${Number(d.attempt.percentage)}%"></span></div><p class="small">Final Score: <b>${d.attempt.score}/${d.attempt.total_questions} (${Number(d.attempt.percentage).toFixed(0)}%)</b></p></div></div>${a.map((x,i)=>{const st=x.is_correct?'correct':!x.selected_answer?'skip':'wrong';const your=x.selected_answer?x['option_'+x.selected_answer.toLowerCase()]:'Not attempted';const right=x['option_'+x.correct_answer.toLowerCase()];return `<div class="card answer-row ${st}"><div class="answer-label">Question ${i+1} · ${x.is_correct?'✅ Correct':!x.selected_answer?'⭕ Not Attempted':'❌ Wrong'}</div><h3>${esc(x.question)}</h3><p><b>Your answer:</b> ${x.selected_answer?x.selected_answer+'. '+esc(your):'Not attempted'}</p><p><b>Correct answer:</b> ${esc(x.correct_answer)}. ${esc(right)}</p><div class="explanation"><b>💡 Explanation</b><br>${esc(x.explanation||'Review the concept and compare your answer with the correct option.')}</div></div>`}).join('')}</div>`}catch(x){alert(x.message)}}
async function leaderboard(){try{const r=await api('/leaderboard');document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-head"><div><h1 style="margin:0">🏆 Leaderboard</h1><span class="small">Top performers based on their best percentage.</span></div><button class="secondary" onclick="home()">← Dashboard</button></div><div class="grid">${r.slice(0,3).map((x,i)=>`<div class="card" style="text-align:center"><div style="font-size:45px">${['🥇','🥈','🥉'][i]}</div><div class="avatar" style="margin:0 auto;font-size:32px">${avatar(x.gender)}</div><h2>${esc(x.name)}</h2><div class="stat">${Number(x.best_percentage).toFixed(0)}%</div><div class="small">${x.attempts} attempts</div></div>`).join('')}</div><div class="card">${table(r.slice(3),['name','gender','best_percentage','attempts'])}</div></div>`}catch(x){alert(x.message)}}
async function admin(){nav();try{const [u,s,q,r,sa]=await Promise.all([api('/users'),api('/subjects'),api('/questions'),api('/results'),api('/suspicious-activity')]);const students=u.filter(x=>x.role==='STUDENT');const passed=r.filter(x=>Number(x.percentage)>=40).length;const failed=r.length-passed;const passPct=r.length?(passed/r.length*100):0;document.getElementById('app').innerHTML=`<div class="wrap"><div class="admin-title"><div><h1 style="margin:0;color:var(--navy)">🛠 Admin Dashboard</h1><p class="small">Manage MCA students, subjects, questions and assessments.</p></div><span class="chip">MySQL Connected</span></div><div class="stat-grid" style="margin:20px 0"><div class="stat-card"><div class="icon">👨‍🎓</div><div class="stat">${students.length}</div><div class="small">Students</div></div><div class="stat-card"><div class="icon">📚</div><div class="stat">${s.length}</div><div class="small">Subjects</div></div><div class="stat-card"><div class="icon">❓</div><div class="stat">${q.length}</div><div class="small">Questions</div></div><div class="stat-card"><div class="icon">📝</div><div class="stat">${r.length}</div><div class="small">Attempts</div></div></div><div class="card pie-card"><div class="section-head" style="margin:0 0 16px"><div><h2>📊 Quiz Performance Overview</h2><span class="small">Passed vs failed quiz attempts.</span></div><span class="chip">${r.length} Attempts</span></div><div class="pie-wrap"><div class="pie-chart" style="background:conic-gradient(var(--success) 0 ${passPct}%, var(--danger) ${passPct}% 100%)"><div class="pie-hole"><div><b>${passPct.toFixed(0)}%</b><span>Pass Rate</span></div></div></div><div class="pie-legend"><div class="pie-legend-row"><div class="pie-label"><span class="pie-dot" style="background:var(--success)"></span>Passed (≥ 40%)</div><div class="pie-value">${passed} (${passPct.toFixed(2)}%)</div></div><div class="pie-legend-row"><div class="pie-label"><span class="pie-dot" style="background:var(--danger)"></span>Failed (&lt; 40%)</div><div class="pie-value">${failed} (${(100-passPct).toFixed(2)}%)</div></div><div class="small">The chart updates automatically from the quiz attempts returned by the backend.</div></div></div></div><div class="grid"><div class="card"><h2>👨‍🎓 Add Student</h2><form id="studentForm" novalidate onsubmit="addStudent(event)"><label>Name</label><input id="stName" minlength="2" maxlength="100" autocomplete="name" required placeholder="Student full name"><label>Email</label><input id="stEmail" type="email" maxlength="150" autocomplete="email" required placeholder="student@example.com"><label>Password</label><input id="stPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Temporary password"><label>Avatar</label><select id="stGender"><option value="FEMALE">👩‍🎓 Girl Student</option><option value="MALE">👨‍🎓 Boy Student</option><option value="OTHER">🧑‍🎓 Other Student</option></select><button>Add Student</button></form></div><div class="card"><h2>📚 Add Subject</h2><form id="subjectForm" novalidate onsubmit="addSubject(event)"><label>Subject Name</label><input id="sname" minlength="2" maxlength="100" required placeholder="e.g. Data Mining"><label>Description</label><input id="sdesc" maxlength="255" placeholder="Short subject description"><label>Subject Emoji</label><input id="sicon" maxlength="4" placeholder="📚"><label>Test Duration (minutes)</label><input id="sduration" type="number" min="1" max="180" step="1" value="10" required><button>Add Subject</button></form><p class="small">Suggested: ☕ Java · 🗄️ DBMS · 🛡️ Cyber Security · ⛏️ Data Mining · ⚙️ Software Engineering</p></div></div><div class="card"><h2>⏱️ Test Timing & Subjects</h2><p class="small">Set the duration students get for each subject. Changes apply to new quiz attempts.</p><div class="table-wrap"><table><tr><th>Subject</th><th>Questions</th><th>Duration</th><th>Action</th></tr>${s.map(x=>`<tr><td>${icon(x)} <b>${esc(x.name)}</b></td><td>${x.question_count||0}</td><td><input id="dur-${x.id}" type="number" min="1" max="180" value="${Number(x.test_duration||10)}" style="width:100px"></td><td><button class="secondary" onclick="setTiming(${x.id})">Save Time</button> <button class="danger" onclick="delSubject(${x.id})">Delete Subject</button></td></tr>`).join('')}</table></div></div><div class="card"><h2>➕ Add Question</h2><form id="questionForm" novalidate onsubmit="addQuestion(event)"><label>Subject</label><select id="qsub">${s.map(x=>`<option value="${x.id}">${icon(x)} ${esc(x.name)}</option>`).join('')}</select><label>Question</label><textarea id="qq" minlength="5" maxlength="1000" required placeholder="Enter the MCA-level question"></textarea><div class="grid"><div><input id="qa" maxlength="500" placeholder="Option A" required><input id="qb" maxlength="500" placeholder="Option B" required></div><div><input id="qc" maxlength="500" placeholder="Option C" required><input id="qd" maxlength="500" placeholder="Option D" required></div></div><label>Correct Answer</label><select id="qcorr"><option>A</option><option>B</option><option>C</option><option>D</option></select><label>Answer Explanation</label><textarea id="qexp" maxlength="1500" placeholder="Explain why the correct answer is correct. This appears in student review."></textarea><button>Add Question ✓</button></form></div><div class="card"><h2>❓ Question Bank</h2>${q.length?q.map(x=>`<div class="answer-row"><div><span class="chip">${icon({name:x.subject_name})} ${esc(x.subject_name)}</span> <b>${esc(x.question)}</b></div><p class="small">Correct: <b>${esc(x.correct_answer)}</b> · ${esc(x.explanation||'No explanation')}</p><button class="danger" onclick="delQuestion(${x.id})">Delete</button></div>`).join(''):'<div class="empty">No questions.</div>'}</div><div class="card"><h2>👥 Students</h2><p class="small">Manage registered MCA students. Deleting a student also removes their quiz attempts and related activity records.</p>${students.length?`<div class="table-wrap"><table><tr><th>Student</th><th>Email</th><th>Avatar</th><th>Joined</th><th>Action</th></tr>${students.map(x=>`<tr><td>${avatar(x.gender)} <b>${esc(x.name)}</b></td><td>${esc(x.email)}</td><td style="font-size:26px">${avatar(x.gender)}</td><td>${new Date(x.created_at).toLocaleString()}</td><td><button class="danger" onclick="delStudent(${x.id})">🗑 Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No students.</div>'}</div><div class="card"><h2>🛡️ Suspicious Activity Monitor</h2><p class="small">Security events detected during assessments.</p>${sa.length?`<div class="table-wrap"><table><tr><th>Student</th><th>Subject</th><th>Activity</th><th>Details</th><th>Time</th></tr>${sa.map(x=>`<tr><td>${avatar(x.gender)} ${esc(x.name)}</td><td>${icon({name:x.subject_name})} ${esc(x.subject_name||'—')}</td><td><span class="status fail">⚠️ ${esc(suspiciousLabel(x.activity_type))}</span></td><td>${esc(x.details||'')}</td><td>${new Date(x.event_time).toLocaleString()}</td></tr>`).join('')}</table></div>`:'<div class="empty">✅ No suspicious activity detected.</div>'}</div><div class="card"><h2>📊 All Quiz Attempts</h2>${table(r,['name','subject_name','score','total_questions','percentage','quiz_date'])}</div></div>`}catch(x){document.getElementById('app').innerHTML=`<div class="wrap"><div class="card">Admin data could not load: ${esc(x.message)}</div></div>`}}
async function addStudent(e){e.preventDefault();if(!validateForm(document.getElementById('studentForm')))return;try{await api('/admin/students',{method:'POST',body:JSON.stringify({name:stName.value.trim(),email:stEmail.value.trim(),password:stPassword.value,gender:stGender.value})});alert('Student added successfully.');admin()}catch(x){alert(x.message)}}
async function addSubject(e){e.preventDefault();if(!validateForm(document.getElementById('subjectForm')))return;try{await api('/subjects',{method:'POST',body:JSON.stringify({name:sname.value.trim(),description:sdesc.value.trim(),icon:sicon.value.trim()||'📚',test_duration:Number(sduration.value)||10})});alert('Subject added.');admin()}catch(x){alert(x.message)}}
async function addQuestion(e){e.preventDefault();if(!validateForm(document.getElementById('questionForm')))return;try{await api('/questions',{method:'POST',body:JSON.stringify({subject_id:qsub.value,question:qq.value,option_a:qa.value,option_b:qb.value,option_c:qc.value,option_d:qd.value,correct_answer:qcorr.value,explanation:qexp.value})});alert('Question added with explanation.');admin()}catch(x){alert(x.message)}}
async function setTiming(id){try{const subject=(await api('/subjects')).find(x=>x.id==id);const duration=Math.max(1,Math.min(180,Number(document.getElementById('dur-'+id).value)||10));await api('/subjects/'+id,{method:'PUT',body:JSON.stringify({name:subject.name,description:subject.description||'',icon:subject.icon||icon(subject),test_duration:duration})});alert(`⏱️ ${subject.name} test time set to ${duration} minute${duration===1?'':'s'}.`);admin()}catch(x){alert(x.message)}}
async function delSubject(id){const subject=(await api('/subjects')).find(x=>x.id==id);if(!subject)return;if(confirm(`Delete ${subject.name}? This will also delete its questions and related quiz attempts.`)){try{await api('/subjects/'+id,{method:'DELETE'});alert('Subject deleted successfully.');admin()}catch(x){alert(x.message)}}}
async function delStudent(id){if(confirm('Delete this student? Their quiz attempts and related activity records will also be removed.')){try{await api('/admin/students/'+id,{method:'DELETE'});alert('Student deleted successfully.');admin()}catch(x){alert(x.message)}}}
async function delQuestion(id){if(confirm('Delete this question?')){try{await api('/questions/'+id,{method:'DELETE'});admin()}catch(x){alert(x.message)}}}
home();
</script></body></html>
